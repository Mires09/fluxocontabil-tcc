<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#21133c" />
  <meta name="description" content="Protótipo interativo de avaliação do Sistema Inteligente para Fechamento Contábil Mensal. Demonstração com dados fictícios." />
  <title>FluxoContábil — Protótipo de Avaliação do TCC</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-logo" aria-hidden="true">✦</span><div><strong>Fluxo<span>Contábil</span></strong><small>PROTÓTIPO · TCC</small></div></div>
      <div class="office-mini"><span class="office-avatar">AC</span><div><b>Aurora Contábil</b><small>Escritório fictício</small></div></div>
      <p class="nav-label">ESPAÇO DE TRABALHO</p>
      <nav id="mainNav" aria-label="Navegação principal"></nav>
      <div class="sidebar-bottom"><div class="demo-rail"><span class="dot-live"></span><div><b>Ambiente demonstrativo</b><small>Nenhum dado real é utilizado.</small></div></div><button type="button" class="reset-link" data-action="reset">↻ Reiniciar demonstração</button></div>
    </aside>
    <div class="sidebar-scrim" id="scrim" data-action="menu-close"></div>
    <div class="workspace">
      <header class="topbar">
        <button type="button" class="menu-button" data-action="menu-toggle" aria-label="Abrir menu">☰</button>
        <div class="breadcrumb"><span class="crumb-office">Aurora Contábil</span><span class="crumb-slash">/</span><b id="crumbTitle">Visão geral</b></div>
        <div class="top-controls"><span class="header-pill"><span class="dot-live"></span> Demonstração</span><label class="role-control" for="roleSelect"><span>Perfil</span><select id="roleSelect"><option value="GESTOR">Gestor</option><option value="CONTADOR">Contador</option></select></label></div>
      </header>
      <main id="main" tabindex="-1" aria-live="polite"></main>
      <footer class="site-footer">Protótipo acadêmico de avaliação • Informações e operações simuladas • Não utilizar dados contábeis reais.</footer>
    </div>
  </div>
  <dialog id="modal" class="modal"><form method="dialog" id="modalContent"></form></dialog>
  <div id="toast" role="status" aria-live="polite" class="toast"></div>
  <script>if ("serviceWorker" in navigator && location.protocol !== "file:") window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script>
</body>
</html>
